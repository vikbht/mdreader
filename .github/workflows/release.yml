name: Release MDReader

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write # Required to create GitHub Releases and upload zip assets

jobs:
  build:
    name: Build & Release (Universal)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify macOS Environment
        run: |
          echo "=== Swift Compiler version ==="
          swiftc --version
          echo "=== macOS SDK path ==="
          xcode-select -p

      - name: Compile and Package Universal App Bundle
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh --universal
          lipo -info build/MDReader.app/Contents/MacOS/MDReader

      - name: Compress App Bundle into Zip
        run: |
          cd build
          # -y preserves symbolic links inside the macOS app bundle structure
          zip -y -r ../MDReader.zip MDReader.app
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MDReader.zip
          draft: false
          prerelease: false
          name: MDReader ${{ github.ref_name || 'Workflow Dispatch Build' }}
          body: |
            🚀 **MDReader Native macOS Release (Universal: Apple Silicon & Intel)**

            This is a fully compiled, signed, and packaged production release of **MDReader**—a lightweight native macOS Markdown previewer.

            ### 📦 Files Included:
            * **`MDReader.zip`**: Universal macOS app bundle (`arm64` + `x86_64`).

            ### 🛠️ Installation Steps:
            1. **Download**: Click `MDReader.zip` below.
            2. **Unzip**: Double-click to extract `MDReader.app`.
            3. **Install**: Drag `MDReader.app` into your **`/Applications/`** folder.

            ### 🖱️ Setup Right-Click Finder Services:
            The first time you install it, run these commands in Terminal to register the Service with Finder and update context menu caches:
            ```bash
            /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/MDReader.app
            /System/Library/CoreServices/pbs -update
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
