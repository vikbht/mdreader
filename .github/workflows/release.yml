name: Release MDReader

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write # Required to create GitHub Releases and upload zip assets

jobs:
  build:
    name: Build & Release
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify macOS Environment
        run: |
          echo "=== Swift Compiler version ==="
          swiftc --version
          echo "=== macOS SDK path ==="
          xcode-select -p

      - name: Compile and Package App Bundle
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh --universal
          file build/MDReader.app/Contents/MacOS/MDReader
          codesign --verify --deep --strict build/MDReader.app

      - name: Compress App Bundle into Zip
        run: |
          cd build
          # -y preserves symbolic links inside the macOS app bundle structure
          zip -y -r ../MDReader.zip MDReader.app
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MDReader.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          name: MDReader ${{ github.ref_name || 'Workflow Dispatch Build' }}
          body: |
            🚀 **MDReader Native macOS Release**

            A lightweight, offline-first native macOS Markdown previewer with glassmorphic floating HUD, Mermaid diagrams, KaTeX math, GitHub Alerts, YAML frontmatter cards, themes, and atomic-save hot-reloading.

            ### 🛠️ Installation Steps
            1. **Download**: Click `MDReader.zip` below.
            2. **Unzip**: Double-click to extract `MDReader.app`.
            3. **Install**: Drag `MDReader.app` into your **`/Applications/`** folder.
            4. **Register Finder Services** (one-time in Terminal):
            ```bash
            /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/MDReader.app
            /System/Library/CoreServices/pbs -update
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
