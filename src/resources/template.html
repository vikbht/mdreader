<!DOCTYPE html>
<html lang="en" data-theme="glass">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDReader Preview</title>
  <style>
    /* CSS placeholder to be dynamically replaced or loaded */
  </style>
  <style id="custom-user-css">
    /* CUSTOM USER CSS */
  </style>
  <script id="marked-js"></script>
  <script id="purify-js"></script>
  <script id="highlight-js"></script>
</head>
<body>
  <!-- Floating Glass Header -->
  <header class="app-header">
    <div class="header-left">
      <span class="file-badge">Markdown</span>
      <h1 id="file-title">Preview</h1>
    </div>
    <div class="header-right">
      <div class="stat-tag" title="Word Count">
        <span class="stat-icon">📝</span>
        <span id="stat-words">0 words</span>
      </div>
      <div class="stat-tag" title="Reading Time">
        <span class="stat-icon">⏱️</span>
        <span id="stat-time">1 min read</span>
      </div>
      <div class="theme-picker-wrap">
        <button id="theme-toggle" class="icon-button" title="Switch Theme" aria-label="Switch Theme" aria-expanded="false">
          <span class="icon-svg">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle>
              <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle>
              <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle>
              <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle>
              <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path>
            </svg>
          </span>
        </button>
        <div id="theme-menu" class="theme-menu" role="menu" aria-hidden="true">
          <button class="theme-option active" data-theme-choice="glass" role="menuitem">
            <span class="theme-swatch swatch-glass"></span><span>Glass</span>
          </button>
          <button class="theme-option" data-theme-choice="github" role="menuitem">
            <span class="theme-swatch swatch-github"></span><span>GitHub</span>
          </button>
          <button class="theme-option" data-theme-choice="sepia" role="menuitem">
            <span class="theme-swatch swatch-sepia"></span><span>Sepia</span>
          </button>
          <button class="theme-option" data-theme-choice="nord" role="menuitem">
            <span class="theme-swatch swatch-nord"></span><span>Nord</span>
          </button>
        </div>
      </div>
      <button id="pin-toggle" class="icon-button active" title="Pinned: Always on Top (⌘⇧T)" aria-label="Toggle Always on Top">
        <span class="icon-svg">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="17" x2="12" y2="22"></line>
            <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path>
          </svg>
        </span>
      </button>
      <button id="toc-toggle" class="icon-button" title="Toggle Outline (⌘⇧O)" aria-label="Toggle Outline">
        <span class="icon-svg">
          <svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="21" y1="10" x2="7" y2="10"></line>
            <line x1="21" y1="6" x2="3" y2="6"></line>
            <line x1="21" y1="14" x2="3" y2="14"></line>
            <line x1="21" y1="18" x2="7" y2="18"></line>
          </svg>
        </span>
      </button>
    </div>
  </header>

  <!-- In-Document Find Bar -->
  <div id="find-bar" class="find-bar" role="search" aria-hidden="true">
    <input id="find-input" type="text" placeholder="Find in document..." autocomplete="off" spellcheck="false" />
    <span id="find-count" class="find-count">0 / 0</span>
    <button id="find-prev" class="find-btn" title="Previous match (⇧↩)" aria-label="Previous match">▲</button>
    <button id="find-next" class="find-btn" title="Next match (↩)" aria-label="Next match">▼</button>
    <button id="find-close" class="find-btn" title="Close (Esc)" aria-label="Close find bar">✕</button>
  </div>

  <!-- Table of Contents Sidebar -->
  <aside id="toc-sidebar" class="toc-sidebar">
    <div class="toc-header">
      <h2>Outline</h2>
    </div>
    <nav id="toc-nav" class="toc-nav">
      <!-- Generated list will go here -->
    </nav>
  </aside>

  <div id="toc-overlay" class="toc-overlay"></div>

  <!-- Main Content Container -->
  <main id="content" class="content-container">
    <div class="welcome-screen">
      <div class="spinner"></div>
      <p>Loading document...</p>
    </div>
  </main>

  <script>
    const BUNDLE_BASE = 'mdreader-doc://bundle/';
    let hasRenderedOnce = false;
    let findMatches = [];
    let currentMatchIndex = -1;
    let katexLoadPromise = null;
    let mermaidLoadPromise = null;
    let mermaidRenderCounter = 0;

    // Native bridge helper
    function postNativeMessage(payload) {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.mdreader) {
        window.webkit.messageHandlers.mdreader.postMessage(payload);
        return true;
      }
      return false;
    }

    // Robust Base64 UTF-8 decoding
    function decodeBase64UTF8(base64Str) {
      if (!base64Str) return '';
      const binaryString = atob(base64Str);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return new TextDecoder("utf-8").decode(bytes);
    }

    // Slugify helper for heading IDs (GitHub-style)
    function slugify(text) {
      return text
        .toString()
        .toLowerCase()
        .trim()
        .replace(/[^\p{L}\p{N}\s-]/gu, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    // Copy text reliably using native NSPasteboard bridge with Web API fallback
    function copyTextToClipboard(text, onSuccess) {
      if (postNativeMessage({ action: 'copyText', text: text })) {
        onSuccess();
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(onSuccess).catch(() => {});
      }
    }

    // =========================================================================
    // Lazy Asset Loaders (100% Offline via mdreader-doc://bundle/)
    // =========================================================================
    function loadScriptOnce(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load ${src}`));
        document.head.appendChild(script);
      });
    }

    function loadStylesheetOnce(href) {
      if (document.querySelector(`link[href="${href}"]`)) return;
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = href;
      document.head.appendChild(link);
    }

    function ensureKaTeX() {
      if (typeof window.katex !== 'undefined') return Promise.resolve(window.katex);
      if (!katexLoadPromise) {
        loadStylesheetOnce(`${BUNDLE_BASE}katex/katex.min.css`);
        katexLoadPromise = loadScriptOnce(`${BUNDLE_BASE}katex/katex.min.js`)
          .then(() => window.katex)
          .catch((err) => {
            katexLoadPromise = null;
            throw err;
          });
      }
      return katexLoadPromise;
    }

    function ensureMermaid() {
      if (typeof window.mermaid !== 'undefined') return Promise.resolve(window.mermaid);
      if (!mermaidLoadPromise) {
        mermaidLoadPromise = loadScriptOnce(`${BUNDLE_BASE}mermaid.min.js`)
          .then(() => window.mermaid)
          .catch((err) => {
            mermaidLoadPromise = null;
            throw err;
          });
      }
      return mermaidLoadPromise;
    }

    // =========================================================================
    // Themes & Appearance
    // =========================================================================
    function isEffectiveDarkMode() {
      const theme = document.documentElement.dataset.theme || 'glass';
      if (theme === 'nord') return true;
      if (theme === 'sepia') return false;
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    function setTheme(themeName, persist) {
      const valid = ['glass', 'github', 'sepia', 'nord'];
      const chosen = valid.includes(themeName) ? themeName : 'glass';
      document.documentElement.dataset.theme = chosen;

      document.querySelectorAll('.theme-option').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.themeChoice === chosen);
      });

      if (persist) {
        postNativeMessage({ action: 'setTheme', theme: chosen });
      }

      // Re-render Mermaid diagrams to match the new theme's dark/light palette
      if (document.querySelector('.mermaid-container')) {
        renderMermaidDiagrams(document.getElementById('content'));
      }
    }

    function closeThemeMenu() {
      const menu = document.getElementById('theme-menu');
      const btn = document.getElementById('theme-toggle');
      if (menu) {
        menu.classList.remove('open');
        menu.setAttribute('aria-hidden', 'true');
      }
      if (btn) btn.setAttribute('aria-expanded', 'false');
    }

    function setPinState(isPinned) {
      const btn = document.getElementById('pin-toggle');
      if (!btn) return;
      btn.classList.toggle('active', !!isPinned);
      btn.title = isPinned
        ? 'Pinned: Always on Top (⌘⇧T)'
        : 'Unpinned: Normal Window (⌘⇧T)';
    }

    function toggleOutline() {
      const sidebar = document.getElementById('toc-sidebar');
      const overlay = document.getElementById('toc-overlay');
      if (document.getElementById('toc-toggle').style.display === 'none') return;
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    function closeOutline() {
      document.getElementById('toc-sidebar').classList.remove('open');
      document.getElementById('toc-overlay').classList.remove('active');
    }

    // =========================================================================
    // YAML Frontmatter Parser & Card Builder
    // =========================================================================
    function extractFrontmatter(markdown) {
      const match = markdown.match(/^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/);
      if (!match) return { metadata: null, body: markdown };

      const rawYaml = match[1];
      const body = markdown.slice(match[0].length);
      const metadata = {};
      const lines = rawYaml.split(/\r?\n/);
      let activeListKey = null;

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#')) continue;

        const listItemMatch = line.match(/^\s*-\s+(.*)$/);
        if (listItemMatch && activeListKey) {
          if (!Array.isArray(metadata[activeListKey])) {
            metadata[activeListKey] = [];
          }
          metadata[activeListKey].push(stripQuotes(listItemMatch[1].trim()));
          continue;
        }

        const kvMatch = line.match(/^([A-Za-z0-9_-]+)\s*:\s*(.*)$/);
        if (kvMatch) {
          const key = kvMatch[1].trim();
          const rawVal = kvMatch[2].trim();
          if (rawVal === '') {
            metadata[key] = [];
            activeListKey = key;
          } else if (rawVal.startsWith('[') && rawVal.endsWith(']')) {
            const inner = rawVal.slice(1, -1).trim();
            metadata[key] = inner
              ? inner.split(',').map((item) => stripQuotes(item.trim())).filter(Boolean)
              : [];
            activeListKey = null;
          } else {
            metadata[key] = stripQuotes(rawVal);
            activeListKey = null;
          }
        }
      }

      if (Object.keys(metadata).length === 0) {
        return { metadata: null, body: markdown };
      }
      return { metadata, body };
    }

    function stripQuotes(val) {
      if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
        return val.slice(1, -1);
      }
      return val;
    }

    function buildFrontmatterCard(metadata) {
      const card = document.createElement('section');
      card.className = 'frontmatter-card';

      const entries = Object.entries(metadata);
      const grid = document.createElement('div');
      grid.className = 'frontmatter-grid';

      for (const [key, val] of entries) {
        const row = document.createElement('div');
        row.className = 'frontmatter-row';

        const keyEl = document.createElement('span');
        keyEl.className = 'frontmatter-key';
        keyEl.textContent = key;
        row.appendChild(keyEl);

        const valEl = document.createElement('div');
        valEl.className = 'frontmatter-val';

        if (Array.isArray(val)) {
          val.forEach((item) => {
            const pill = document.createElement('span');
            pill.className = 'frontmatter-tag';
            pill.textContent = String(item);
            valEl.appendChild(pill);
          });
        } else {
          valEl.textContent = String(val);
        }

        row.appendChild(valEl);
        grid.appendChild(row);
      }

      card.appendChild(grid);
      return card;
    }

    // =========================================================================
    // Math Extraction (Protects LaTeX from Marked's Emphasis Parser)
    // =========================================================================
    function extractMathExpressions(markdown) {
      const mathItems = [];
      const codePlaceholders = [];

      // 1. Temporarily protect fenced code blocks and inline code spans
      let protectedText = markdown.replace(/(^|\n)(```|~~~)[^\n]*\n[\s\S]*?\n\2[ \t]*(?=\n|$)/g, (m) => {
        const idx = codePlaceholders.length;
        codePlaceholders.push(m);
        return `@@MDREADERCODEBLOCK${idx}@@`;
      });

      protectedText = protectedText.replace(/(`+)([^\n`]+?)\1/g, (m) => {
        const idx = codePlaceholders.length;
        codePlaceholders.push(m);
        return `@@MDREADERCODEBLOCK${idx}@@`;
      });

      // 2. Extract display math $$...$$
      protectedText = protectedText.replace(/\$\$([\s\S]+?)\$\$/g, (match, expr) => {
        const trimmed = expr.trim();
        if (!trimmed) return match;
        const idx = mathItems.length;
        mathItems.push({ expr: trimmed, displayMode: true });
        return `\n\n@@MDREADERMATH${idx}@@\n\n`;
      });

      // 3. Extract inline math $...$ (avoids currency like "$5 and $10")
      protectedText = protectedText.replace(/(^|[^\\$])\$(?!\s)([^\n$]+?)(?<!\s)\$(?!\d)/g, (match, prefix, expr) => {
        const idx = mathItems.length;
        mathItems.push({ expr: expr.trim(), displayMode: false });
        return `${prefix}@@MDREADERMATH${idx}@@`;
      });

      // 4. Restore protected code blocks
      protectedText = protectedText.replace(/@@MDREADERCODEBLOCK(\d+)@@/g, (_, idx) => codePlaceholders[Number(idx)]);

      return { text: protectedText, mathItems };
    }

    async function hydrateMathExpressions(container, mathItems) {
      if (!mathItems || mathItems.length === 0) return;

      try {
        const katex = await ensureKaTeX();
        const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
        const nodesToUpdate = [];
        let node;
        while ((node = walker.nextNode())) {
          if (node.nodeValue && node.nodeValue.includes('@@MDREADERMATH')) {
            nodesToUpdate.push(node);
          }
        }

        const tokenRegex = /@@MDREADERMATH(\d+)@@/g;
        nodesToUpdate.forEach((textNode) => {
          const text = textNode.nodeValue;
          const frag = document.createDocumentFragment();
          let lastIdx = 0;
          let match;
          tokenRegex.lastIndex = 0;

          while ((match = tokenRegex.exec(text)) !== null) {
            if (match.index > lastIdx) {
              frag.appendChild(document.createTextNode(text.slice(lastIdx, match.index)));
            }
            const item = mathItems[Number(match[1])];
            if (item) {
              const rawMathHtml = katex.renderToString(item.expr, {
                displayMode: item.displayMode,
                throwOnError: false,
                trust: false,
                strict: false
              });
              const safeMathHtml = typeof DOMPurify !== 'undefined'
                ? DOMPurify.sanitize(rawMathHtml, { USE_PROFILES: { html: true, mathMl: true } })
                : rawMathHtml;

              const wrapper = document.createElement(item.displayMode ? 'div' : 'span');
              wrapper.className = item.displayMode ? 'math-display' : 'math-inline';
              wrapper.innerHTML = safeMathHtml;
              frag.appendChild(wrapper);
            }
            lastIdx = match.index + match[0].length;
          }

          if (lastIdx < text.length) {
            frag.appendChild(document.createTextNode(text.slice(lastIdx)));
          }
          if (textNode.parentNode) {
            textNode.parentNode.replaceChild(frag, textNode);
          }
        });
      } catch (err) {
        console.error('KaTeX rendering failed:', err);
      }
    }

    // =========================================================================
    // GitHub-Style Alerts (> [!NOTE], [!TIP], [!IMPORTANT], [!WARNING], [!CAUTION])
    // =========================================================================
    const ALERT_CONFIG = {

      },
      TIP: {
        label: 'Tip',
        className: 'markdown-alert-tip',
        icon: '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 1.5c-2.363 0-4 1.69-4 3.75 0 .984.424 1.625.984 2.304l.214.253c.223.264.47.556.673.848.284.411.537.896.621 1.49a.75.75 0 0 1-1.484.211c-.04-.282-.163-.547-.37-.847a8.456 8.456 0 0 0-.542-.68c-.084-.1-.173-.205-.268-.32C3.201 7.75 2.5 6.766 2.5 5.25 2.5 2.31 4.863 0 8 0s5.5 2.31 5.5 5.25c0 1.516-.701 2.5-1.328 3.259-.095.115-.184.22-.268.319-.207.245-.383.453-.541.681-.208.3-.33.565-.37.847a.751.751 0 0 1-1.485-.212c.084-.593.337-1.078.621-1.489.203-.292.45-.584.673-.848.075-.088.147-.173.213-.253.561-.679.985-1.32.985-2.304 0-2.06-1.637-3.75-4-3.75ZM5.75 12h4.5a.75.75 0 0 1 0 1.5h-4.5a.75.75 0 0 1 0-1.5ZM6 15.25a.75.75 0 0 1 .75-.75h2.5a.75.75 0 0 1 0 1.5h-2.5a.75.75 0 0 1-.75-.75Z"></path></svg>'
      },
      IMPORTANT: {
        label: 'Important',
        className: 'markdown-alert-important',
        icon: '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v9.5A1.75 1.75 0 0 1 14.25 13H8.06l-2.573 2.573A1.458 1.458 0 0 1 3 14.543V13H1.75A1.75 1.75 0 0 1 0 11.25Zm1.75-.25a.25.25 0 0 0-.25.25v9.5c0 .138.112.25.25.25h2a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.749.749 0 0 1 .53-.22h6.5a.25.25 0 0 0 .25-.25v-9.5a.25.25 0 0 0-.25-.25Zm7 2.25v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 9a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"></path></svg>'
      },
      WARNING: {
        label: 'Warning',
        className: 'markdown-alert-warning',
        icon: '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575Zm1.763.707a.25.25 0 0 0-.44 0L1.698 13.132a.25.25 0 0 0 .22.368h12.164a.25.25 0 0 0 .22-.368Zm.53 3.996v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"></path></svg>'
      },
      CAUTION: {
        label: 'Caution',
        className: 'markdown-alert-caution',
        icon: '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M4.47.22A.749.749 0 0 1 5 0h6c.199 0 .389.079.53.22l4.25 4.25c.141.14.22.331.22.53v6a.749.749 0 0 1-.22.53l-4.25 4.25A.749.749 0 0 1 11 16H5a.749.749 0 0 1-.53-.22L.22 11.53A.749.749 0 0 1 0 11V5c0-.199.079-.389.22-.53Zm.84 1.28L1.5 5.31v5.38l3.81 3.81h5.38l3.81-3.81V5.31L10.69 1.5ZM8 4a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"></path></svg>'
      }
    };

    function transformGitHubAlerts(container) {
      container.querySelectorAll('blockquote').forEach((bq) => {
        const firstP = bq.querySelector(':scope > p');
        if (!firstP) return;

        const match = firstP.innerHTML.match(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\](?:<br\s*\/?>|\r?\n|\s+)?/i);
        if (!match) return;

        const type = match[1].toUpperCase();
        const cfg = ALERT_CONFIG[type];
        if (!cfg) return;

        bq.classList.add('markdown-alert', cfg.className);

        const titleEl = document.createElement('p');
        titleEl.className = 'markdown-alert-title';
        titleEl.innerHTML = `${cfg.icon}<span>${cfg.label}</span>`;

        const remainder = firstP.innerHTML.slice(match[0].length).trim();
        if (remainder) {
          firstP.innerHTML = remainder;
          bq.insertBefore(titleEl, firstP);
        } else {
          bq.replaceChild(titleEl, firstP);
        }
      });
    }

    // =========================================================================
    // Mermaid Diagram Rendering (Lazy-Loaded & Theme-Adaptive)
    // =========================================================================
    function prepareMermaidContainers(container) {
      const blocks = container.querySelectorAll('pre > code.language-mermaid');
      blocks.forEach((code) => {
        const pre = code.parentElement;
        const src = code.textContent.trim();
        const wrapper = document.createElement('div');
        wrapper.className = 'mermaid-container';
        wrapper.dataset.mermaidSrc = src;
        wrapper.innerHTML = '<div class="mermaid-loading">Rendering diagram…</div>';
        pre.replaceWith(wrapper);
      });
      return blocks.length > 0;
    }

    async function renderMermaidDiagrams(container) {
      const containers = container.querySelectorAll('.mermaid-container');
      if (containers.length === 0) return;

      try {
        const mermaid = await ensureMermaid();
        mermaid.initialize({
          startOnLoad: false,
          securityLevel: 'strict',
          theme: isEffectiveDarkMode() ? 'dark' : 'default',
          fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
        });

        for (const el of containers) {
          const src = el.dataset.mermaidSrc || '';
          if (!src) continue;
          const id = `mdreader-mermaid-${++mermaidRenderCounter}`;
          try {
            const { svg } = await mermaid.render(id, src);
            el.innerHTML = svg;
          } catch (renderErr) {
            el.innerHTML = '';
            const errBox = document.createElement('div');
            errBox.className = 'mermaid-error';
            const header = document.createElement('strong');
            header.textContent = 'Mermaid syntax error';
            const pre = document.createElement('pre');
            pre.textContent = src;
            errBox.appendChild(header);
            errBox.appendChild(pre);
            el.appendChild(errBox);
          }
        }
      } catch (err) {
        console.error('Mermaid load failed:', err);
      }
    }

    // =========================================================================
    // In-Document Find
    // =========================================================================
    function clearFindHighlights() {
      const marks = document.querySelectorAll('mark.find-highlight');
      marks.forEach((mark) => {
        const parent = mark.parentNode;
        if (parent) {
          parent.replaceChild(document.createTextNode(mark.textContent), mark);
          parent.normalize();
        }
      });
      findMatches = [];
      currentMatchIndex = -1;
      document.getElementById('find-count').textContent = '0 / 0';
    }

    function performFind(query) {
      clearFindHighlights();
      const trimmed = (query || '').trim();
      if (!trimmed) return;

      const article = document.querySelector('#content .markdown-body');
      if (!article) return;

      const lowerQuery = trimmed.toLowerCase();
      const walker = document.createTreeWalker(article, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          const parentTag = node.parentNode && node.parentNode.nodeName;
          if (parentTag === 'SCRIPT' || parentTag === 'STYLE' || parentTag === 'BUTTON' || parentTag === 'SVG') {
            return NodeFilter.FILTER_REJECT;
          }
          if (node.parentElement && node.parentElement.closest('.mermaid-container, .katex')) {
            return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      });

      const textNodes = [];
      let current;
      while ((current = walker.nextNode())) {
        textNodes.push(current);
      }

      textNodes.forEach((node) => {
        const text = node.nodeValue;
        const lowerText = text.toLowerCase();
        let idx = lowerText.indexOf(lowerQuery);
        if (idx === -1) return;

        const frag = document.createDocumentFragment();
        let lastIdx = 0;
        while (idx !== -1) {
          if (idx > lastIdx) {
            frag.appendChild(document.createTextNode(text.slice(lastIdx, idx)));
          }
          const mark = document.createElement('mark');
          mark.className = 'find-highlight';
          mark.textContent = text.slice(idx, idx + trimmed.length);
          frag.appendChild(mark);
          findMatches.push(mark);

          lastIdx = idx + trimmed.length;
          idx = lowerText.indexOf(lowerQuery, lastIdx);
        }
        if (lastIdx < text.length) {
          frag.appendChild(document.createTextNode(text.slice(lastIdx)));
        }
        node.parentNode.replaceChild(frag, node);
      });

      if (findMatches.length > 0) {
        jumpToMatch(0);
      }
    }

    function jumpToMatch(index) {
      if (findMatches.length === 0) return;
      findMatches.forEach((m) => m.classList.remove('current'));
      currentMatchIndex = ((index % findMatches.length) + findMatches.length) % findMatches.length;
      const target = findMatches[currentMatchIndex];
      target.classList.add('current');
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      document.getElementById('find-count').textContent = `${currentMatchIndex + 1} / ${findMatches.length}`;
    }

    function openFindBar() {
      closeThemeMenu();
      const bar = document.getElementById('find-bar');
      const input = document.getElementById('find-input');
      bar.classList.add('open');
      bar.setAttribute('aria-hidden', 'false');
      input.focus();
      input.select();
      if (input.value) {
        performFind(input.value);
      }
    }

    function closeFindBar() {
      const bar = document.getElementById('find-bar');
      bar.classList.remove('open');
      bar.setAttribute('aria-hidden', 'true');
      clearFindHighlights();
    }

    // =========================================================================
    // Document Rendering Pipeline
    // =========================================================================
    async function updateContent(base64Markdown, fileName) {
      try {
        const rawMarkdown = decodeBase64UTF8(base64Markdown);
        const prevScrollY = window.scrollY;
        const activeFindQuery = document.getElementById('find-bar').classList.contains('open')
          ? document.getElementById('find-input').value
          : '';

        // 1. Extract optional YAML frontmatter
        const { metadata, body } = extractFrontmatter(rawMarkdown);

        // 2. Update window/header title
        const displayTitle = fileName || 'Markdown Preview';
        document.getElementById('file-title').textContent = displayTitle;
        document.title = displayTitle;

        // 3. Protect math expressions from Marked before parsing
        const { text: mathProtectedBody, mathItems } = extractMathExpressions(body);

        // 4. Parse Markdown (GFM) and sanitize via DOMPurify
        const rawHtml = marked.parse(mathProtectedBody, { gfm: true, breaks: false });
        const safeHtml = typeof DOMPurify !== 'undefined'
          ? DOMPurify.sanitize(rawHtml, {
              USE_PROFILES: { html: true },
              ADD_ATTR: ['target', 'checked', 'disabled', 'type']
            })
          : rawHtml;

        // 5. Render into DOM (fade-in only on initial load)
        const contentContainer = document.getElementById('content');
        const animClass = hasRenderedOnce ? '' : ' fade-in';
        contentContainer.innerHTML = `<article class="markdown-body${animClass}">${safeHtml}</article>`;

        const articleEl = contentContainer.querySelector('article.markdown-body');
        if (metadata && articleEl) {
          articleEl.insertBefore(buildFrontmatterCard(metadata), articleEl.firstChild);
        }

        // 6. Calculate statistics from Markdown body
        const trimmedText = body.trim();
        const wordCount = trimmedText ? trimmedText.split(/\s+/).filter(w => w.length > 0).length : 0;
        const readTime = Math.max(1, Math.round(wordCount / 200));
        document.getElementById('stat-words').textContent = `${wordCount.toLocaleString()} words`;
        document.getElementById('stat-time').textContent = `${readTime} min read`;

        // 7. Transform GitHub-style alerts
        transformGitHubAlerts(contentContainer);

        // 8. Prepare Mermaid diagrams before Highlight.js touches code blocks
        const hasMermaid = prepareMermaidContainers(contentContainer);

        // 9. Assign GitHub-compatible unique IDs & build Outline TOC
        const allHeadings = contentContainer.querySelectorAll('h1, h2, h3, h4, h5, h6');
        const usedSlugs = new Map();
        allHeadings.forEach((heading, idx) => {
          const baseSlug = slugify(heading.textContent) || `section-${idx + 1}`;
          const count = usedSlugs.get(baseSlug) || 0;
          usedSlugs.set(baseSlug, count + 1);
          heading.id = count === 0 ? baseSlug : `${baseSlug}-${count}`;
        });

        const tocHeadings = contentContainer.querySelectorAll('h1, h2, h3');
        const tocNav = document.getElementById('toc-nav');
        tocNav.innerHTML = '';

        if (tocHeadings.length > 0) {
          const tocList = document.createElement('ul');
          tocHeadings.forEach((heading) => {
            const listItem = document.createElement('li');
            listItem.className = `toc-item toc-${heading.tagName.toLowerCase()}`;

            const link = document.createElement('a');
            link.href = `#${heading.id}`;
            link.textContent = heading.textContent;

            link.addEventListener('click', (e) => {
              e.preventDefault();
              closeOutline();
              heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
              document.querySelectorAll('.toc-item a').forEach(a => a.classList.remove('active'));
              link.classList.add('active');
            });

            listItem.appendChild(link);
            tocList.appendChild(listItem);
          });

          tocNav.appendChild(tocList);
          document.getElementById('toc-toggle').style.display = 'flex';
        } else {
          document.getElementById('toc-toggle').style.display = 'none';
          closeOutline();
        }

        // 10. Smooth scroll for in-document anchor links
        contentContainer.querySelectorAll('a[href^="#"]').forEach((anchor) => {
          anchor.addEventListener('click', (e) => {
            const targetId = decodeURIComponent(anchor.getAttribute('href').slice(1));
            const targetEl = document.getElementById(targetId) || document.getElementById(slugify(targetId));
            if (targetEl) {
              e.preventDefault();
              targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          });
        });

        // 11. Style task list checkboxes
        contentContainer.querySelectorAll('li > input[type="checkbox"]').forEach((checkbox) => {
          checkbox.parentElement.classList.add('task-list-item');
        });

        // 12. Syntax highlight remaining code blocks via Highlight.js
        if (typeof hljs !== 'undefined') {
          contentContainer.querySelectorAll('pre code').forEach((block) => {
            hljs.highlightElement(block);
          });
        }

        // 13. Add native-backed Copy button and language pill to code blocks
        contentContainer.querySelectorAll('pre').forEach((pre) => {
          if (pre.querySelector('.copy-button')) return;
          pre.style.position = 'relative';

          const code = pre.querySelector('code');
          if (!code) return;

          const langClass = Array.from(code.classList).find((c) => c.startsWith('language-'));
          if (langClass) {
            const langLabel = document.createElement('span');
            langLabel.className = 'code-lang-label';
            langLabel.textContent = langClass.replace('language-', '');
            pre.appendChild(langLabel);
          }

          const copyButton = document.createElement('button');
          copyButton.className = 'copy-button';
          copyButton.textContent = 'Copy';

          copyButton.addEventListener('click', () => {
            copyTextToClipboard(code.textContent, () => {
              copyButton.textContent = 'Copied!';
              copyButton.classList.add('copied');
              setTimeout(() => {
                copyButton.textContent = 'Copy';
                copyButton.classList.remove('copied');
              }, 1800);
            });
          });
          pre.appendChild(copyButton);
        });

        // 14. Hydrate KaTeX math & Mermaid diagrams lazily (in parallel)
        const asyncTasks = [];
        if (mathItems.length > 0) {
          asyncTasks.push(hydrateMathExpressions(contentContainer, mathItems));
        }
        if (hasMermaid) {
          asyncTasks.push(renderMermaidDiagrams(contentContainer));
        }
        if (asyncTasks.length > 0) {
          await Promise.all(asyncTasks);
        }

        // 15. Restore scroll position on hot-reloads
        if (hasRenderedOnce) {
          window.scrollTo(0, prevScrollY);
          if (activeFindQuery) {
            performFind(activeFindQuery);
          }
        } else {
          hasRenderedOnce = true;
        }
      } catch (err) {
        const errorContainer = document.getElementById('content');
        errorContainer.innerHTML = '';
        const box = document.createElement('div');
        box.className = 'error-screen';
        const title = document.createElement('h3');
        title.textContent = 'Error Rendering Markdown';
        const msg = document.createElement('p');
        msg.textContent = err && err.message ? err.message : String(err);
        box.appendChild(title);
        box.appendChild(msg);
        errorContainer.appendChild(box);
      }
    }

    // =========================================================================
    // Event Bindings
    // =========================================================================
    document.getElementById('toc-toggle').addEventListener('click', () => {
      closeThemeMenu();
      toggleOutline();
    });
    document.getElementById('toc-overlay').addEventListener('click', closeOutline);

    document.getElementById('pin-toggle').addEventListener('click', () => {
      postNativeMessage({ action: 'togglePin' });
    });

    document.getElementById('theme-toggle').addEventListener('click', (e) => {
      e.stopPropagation();
      const menu = document.getElementById('theme-menu');
      const isOpen = menu.classList.toggle('open');
      menu.setAttribute('aria-hidden', String(!isOpen));
      document.getElementById('theme-toggle').setAttribute('aria-expanded', String(isOpen));
    });

    document.querySelectorAll('.theme-option').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        setTheme(btn.dataset.themeChoice, true);
        closeThemeMenu();
      });
    });

    document.addEventListener('click', () => {
      closeThemeMenu();
    });

    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (document.querySelector('.mermaid-container')) {
          renderMermaidDiagrams(document.getElementById('content'));
        }
      });
    }

    document.getElementById('find-input').addEventListener('input', (e) => {
      performFind(e.target.value);
    });

    document.getElementById('find-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        jumpToMatch(e.shiftKey ? currentMatchIndex - 1 : currentMatchIndex + 1);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        closeFindBar();
      }
    });

    document.getElementById('find-prev').addEventListener('click', () => jumpToMatch(currentMatchIndex - 1));
    document.getElementById('find-next').addEventListener('click', () => jumpToMatch(currentMatchIndex + 1));
    document.getElementById('find-close').addEventListener('click', closeFindBar);

    // Dismiss popovers/find/outline on Escape before closing the window
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const themeOpen = document.getElementById('theme-menu').classList.contains('open');
        const findOpen = document.getElementById('find-bar').classList.contains('open');
        const tocOpen = document.getElementById('toc-sidebar').classList.contains('open');
        if (themeOpen) {
          e.preventDefault();
          e.stopPropagation();
          closeThemeMenu();
        } else if (findOpen) {
          e.preventDefault();
          e.stopPropagation();
          closeFindBar();
        } else if (tocOpen) {
          e.preventDefault();
          e.stopPropagation();
          closeOutline();
        }
      }
    });
  </script>
</body>
</html>
