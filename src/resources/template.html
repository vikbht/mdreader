<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDReader Preview</title>
  <style>
    /* CSS placeholder to be dynamically replaced or loaded */
  </style>
  <script id="marked-js"></script>
  <script id="prism-js"></script>
</head>
<body>
  <!-- Floating Glass Header for stats -->
  <header class="app-header">
    <div class="header-left">
      <span class="file-badge">Markdown</span>
      <h1 id="file-title">Preview</h1>
    </div>
    <div class="header-right">
      <div class="stat-tag" title="Word Count">
        <span class="stat-icon">📝</span>
        <span id="stat-words">0 words</span>
      </div>
      <div class="stat-tag" title="Reading Time">
        <span class="stat-icon">⏱️</span>
        <span id="stat-time">1 min read</span>
      </div>
      <button id="toc-toggle" class="icon-button" title="Toggle Table of Contents">
        <span class="icon-svg">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="21" y1="10" x2="7" y2="10"></line>
            <line x1="21" y1="6" x2="3" y2="6"></line>
            <line x1="21" y1="14" x2="3" y2="14"></line>
            <line x1="21" y1="18" x2="7" y2="18"></line>
          </svg>
        </span>
      </button>
    </div>
  </header>

  <!-- Table of Contents Sidebar -->
  <aside id="toc-sidebar" class="toc-sidebar">
    <div class="toc-header">
      <h2>Outline</h2>
    </div>
    <nav id="toc-nav" class="toc-nav">
      <!-- Generated list will go here -->
    </nav>
  </aside>
  
  <div id="toc-overlay" class="toc-overlay"></div>

  <!-- Main Content Container -->
  <main id="content" class="content-container">
    <div class="welcome-screen">
      <div class="spinner"></div>
      <p>Loading document...</p>
    </div>
  </main>

  <script>
    // Robust Base64 UTF-8 decoding
    function decodeBase64UTF8(base64Str) {
      const binaryString = atob(base64Str);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return new TextDecoder("utf-8").decode(bytes);
    }

    // Slugify helper for heading IDs
    function slugify(text) {
      return text
        .toString()
        .toLowerCase()
        .trim()
        .replace(/\s+/g, '-')             // Replace spaces with -
        .replace(/[^\w\-]+/g, '')         // Remove all non-word chars
        .replace(/\-\-+/g, '-')           // Replace multiple - with single -
        .replace(/^-+/, '')               // Trim - from start
        .replace(/-+$/, '');              // Trim - from end
    }

    // Update document content
    function updateContent(base64Markdown, fileName) {
      try {
        const markdownText = decodeBase64UTF8(base64Markdown);
        
        // Update window/header title
        const displayTitle = fileName || 'Markdown Preview';
        document.getElementById('file-title').textContent = displayTitle;
        document.title = displayTitle;

        // Parse Markdown using marked
        const rawHtml = marked.parse(markdownText);
        
        // Wrap content in a fade-in animation block
        const contentContainer = document.getElementById('content');
        contentContainer.innerHTML = `<article class="markdown-body fade-in">${rawHtml}</article>`;

        // Calculate statistics
        const wordCount = markdownText.trim().split(/\s+/).filter(w => w.length > 0).length;
        const readTime = Math.max(1, Math.round(wordCount / 200));
        
        document.getElementById('stat-words').textContent = `${wordCount.toLocaleString()} words`;
        document.getElementById('stat-time').textContent = `${readTime} min read`;

        // Process headings to add IDs and build Table of Contents
        const headings = contentContainer.querySelectorAll('h1, h2, h3');
        const tocNav = document.getElementById('toc-nav');
        tocNav.innerHTML = '';

        if (headings.length > 0) {
          const tocList = document.createElement('ul');
          let headingCount = 0;

          headings.forEach((heading) => {
            headingCount++;
            const textContent = heading.textContent;
            
            // Assign a unique ID to heading if not present
            if (!heading.id) {
              heading.id = `heading-${headingCount}-${slugify(textContent)}`;
            }

            // Create TOC item
            const listItem = document.createElement('li');
            listItem.className = `toc-item toc-${heading.tagName.toLowerCase()}`;
            
            const link = document.createElement('a');
            link.href = `#${heading.id}`;
            link.textContent = textContent;
            
            // Smooth scroll click handler
            link.addEventListener('click', (e) => {
              e.preventDefault();
              document.getElementById('toc-sidebar').classList.remove('open');
              document.getElementById('toc-overlay').classList.remove('active');
              
              heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
              
              // Highlight selected
              document.querySelectorAll('.toc-item a').forEach(a => a.classList.remove('active'));
              link.classList.add('active');
            });

            listItem.appendChild(link);
            tocList.appendChild(listItem);
          });
          
          tocNav.appendChild(tocList);
          document.getElementById('toc-toggle').style.display = 'flex';
        } else {
          document.getElementById('toc-toggle').style.display = 'none';
        }

        // Highlight code syntax using Prism
        Prism.highlightAll();

        // Implement copy buttons on pre blocks
        const preBlocks = contentContainer.querySelectorAll('pre');
        preBlocks.forEach((pre) => {
          // Check if already has copy button
          if (pre.querySelector('.copy-button')) return;

          // Wrap pre content or make pre relative
          pre.style.position = 'relative';
          
          const copyButton = document.createElement('button');
          copyButton.className = 'copy-button';
          copyButton.textContent = 'Copy';
          
          const code = pre.querySelector('code');
          if (code) {
            copyButton.addEventListener('click', () => {
              navigator.clipboard.writeText(code.textContent).then(() => {
                copyButton.textContent = 'Copied!';
                copyButton.classList.add('copied');
                setTimeout(() => {
                  copyButton.textContent = 'Copy';
                  copyButton.classList.remove('copied');
                }, 2000);
              });
            });
            pre.appendChild(copyButton);
          }
        });

      } catch (err) {
        document.getElementById('content').innerHTML = `
          <div class="error-screen">
            <h3>Error Rendering Markdown</h3>
            <p>${err.message}</p>
          </div>
        `;
      }
    }

    // Toggle Table of Contents Sidebar
    document.getElementById('toc-toggle').addEventListener('click', () => {
      document.getElementById('toc-sidebar').classList.toggle('open');
      document.getElementById('toc-overlay').classList.toggle('active');
    });

    document.getElementById('toc-overlay').addEventListener('click', () => {
      document.getElementById('toc-sidebar').classList.remove('open');
      document.getElementById('toc-overlay').classList.remove('active');
    });
  </script>
</body>
</html>
